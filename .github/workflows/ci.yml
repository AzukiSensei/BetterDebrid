name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: betterdebrid_test
          POSTGRES_USER: betterdebrid
          POSTGRES_PASSWORD: betterdebrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betterdebrid -d betterdebrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3333
      LOG_LEVEL: error
      APP_KEY: 5B7Zb3tHP5pmxQmFW8pjkvyGW9FLW4d4
      APP_URL: http://127.0.0.1:3333
      SESSION_DRIVER: memory
      DATABASE_URL: postgresql://betterdebrid:betterdebrid@127.0.0.1:5432/betterdebrid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ace migration:run --force
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
