services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: betterdebrid
      POSTGRES_USER: betterdebrid
      POSTGRES_PASSWORD: betterdebrid
    ports:
      - '5432:5432'
    volumes:
      - betterdebrid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U betterdebrid -d betterdebrid']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  betterdebrid-postgres:
